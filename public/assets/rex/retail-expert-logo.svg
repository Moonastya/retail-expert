<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img" aria-label="Retail Expert">
  <defs>
    <linearGradient id="rex-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="52%" stop-color="#16d7c4" />
      <stop offset="100%" stop-color="#2a6fd4" />
    </linearGradient>
    <linearGradient id="rex-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eef8ff" />
      <stop offset="100%" stop-color="#c5d4ea" />
    </linearGradient>
  </defs>

  <rect x="0" y="4" width="40" height="40" rx="11" fill="url(#rex-mark)" />
  <rect
    x="0.75"
    y="4.75"
