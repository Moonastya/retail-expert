    letter-spacing="0.04em"
  >
    RE
  </text>

  <text
    x="52"
    y="21"
    fill="url(#rex-word)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="700"
    letter-spacing="0.1em"
  >
